<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <title>GR 테마 RSI</title>
    <meta name="description" content="국내/미국 테마 종목 RSI · 과매도 알림 · 주봉 매물대를 GR 스타일 차트로" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="title-row">
          <h1>📈 GR 테마 RSI</h1>
          <span class="updated-at" id="updatedAt">불러오는 중…</span>
        </div>
        <div class="seg" id="marketToggle">
          <button class="on" data-market="ALL">전체</button>
          <button data-market="KR">🇰🇷 국내</button>
          <button data-market="US">🇺🇸 미국</button>
        </div>
        <nav class="tabs" id="tabBar">
          <button class="on" data-tab="all">전체 종목</button>
          <button data-tab="alert">과매도 알림</button>
          <button data-tab="chart">차트</button>
          <button data-tab="profile">매물대</button>
        </nav>
      </header>

      <main>
        <section class="panel on" id="panel-all"></section>
        <section class="panel" id="panel-alert"></section>
        <section class="panel" id="panel-chart"></section>
        <section class="panel" id="panel-profile"></section>
      </main>

      <footer class="credit">RSI(14) 일봉·주봉 · 과매도 30 이하 · 20일 평균 거래량 필터 · 주봉 매물대 · 투자 조언 아님</footer>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
